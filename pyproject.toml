[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "positronic-agent-interface"
version = "0.1.0"
description = "Polytemporal memory agent interface over memeng"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
  "memeng @ git+https://github.com/ShingWong/positronic-engram.git@v0.2.0",
]

[project.scripts]
positronic = "positronic_ai.cli:main"

[tool.setuptools.packages.find]
include = ["positronic_ai*"]