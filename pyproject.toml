[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "positronic-agent-interface"
version = "0.1.0"
description = "Polytemporal memory agent interface over memeng"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
requires-python = ">=3.10"
dependencies = [
  "memeng @ git+https://github.com/ShingWong/positronic-engram.git@v0.3.0#subdirectory=engine",
  # Pinned to the commit that adds logschema.classify (public record->class
  # API). Bump deliberately: floating on master would move the classifier
  # under the ingester without review.
  "positronic-logschema @ git+https://github.com/ShingWong/positronic-logschema.git@044b13367099f03d0bd920becea1eac0458fc12f",
]

[project.optional-dependencies]
# Undeclared before: the server and attachment tests need fastapi + uvicorn,
# the attachment test needs openpyxl, fastapi's test client needs httpx2, and
# the S3 Object Lock archive tests need boto3 (imported at positronic_ai/
# archive.py). Locally these all came from the ambient system interpreter, so a
# clean install could not even collect the suite.
test = ["pytest>=8", "fastapi", "uvicorn", "openpyxl", "httpx2", "boto3"]

[project.scripts]
positronic = "positronic_ai.cli:main"

[tool.setuptools.packages.find]
include = ["positronic_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]